<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحليل PDF - مفردات المرتب</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .upload-section {
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .analysis-result {
            background: #f9f9f9;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            border-left: 4px solid #007bff;
        }
        .text-item {
            padding: 5px;
            border-bottom: 1px solid #eee;
            font-family: monospace;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>تحليل PDF - مفردات المرتب</h1>
        
        <div class="upload-section">
            <input type="file" id="pdfInput" accept=".pdf" />
            <button onclick="analyzePDF()">تحليل الملف</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        async function analyzePDF() {
            const fileInput = document.getElementById('pdfInput');
            const resultsDiv = document.getElementById('results');
            
            if (!fileInput.files[0]) {
                alert('الرجاء اختيار ملف PDF');
                return;
            }

            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            
            try {
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                let html = `<div class="analysis-result">
                    <h3>ملخص الملف</h3>
                    <p>عدد الصفحات: ${pdf.numPages}</p>
                </div>`;

                // Analyze first few pages
                for (let i = 1; i <= Math.min(pdf.numPages, 5); i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const viewport = page.getViewport({ scale: 1.0 });
                    
                    html += `<div class="analysis-result">
                        <h3>صفحة ${i}</h3>
                        <p>الحجم: ${viewport.width.toFixed(0)} x ${viewport.height.toFixed(0)}</p>
                        <p>عدد عناصر النص: ${textContent.items.length}</p>
                        <h4>أول 20 عنصر نصي مع الإحداثيات:</h4>
                        <div>`;
                    
                    textContent.items.slice(0, 20).forEach((item, idx) => {
                        const x = item.transform[4].toFixed(1);
                        const y = item.transform[5].toFixed(1);
                        const fontSize = item.transform[0].toFixed(1);
                        html += `<div class="text-item">
                            ${idx + 1}. "${item.str}" | الموقع: (${x}, ${y}) | الحجم: ${fontSize}
                        </div>`;
                    });
                    
                    html += `</div>`;
                    
                    // Full text analysis
                    const fullText = textContent.items.map(item => item.str).join(' ');
                    html += `<h4>النص الكامل (أول 300 حرف):</h4>
                        <p>${fullText.substring(0, 300)}...</p>`;
                    
                    // Pattern detection
                    html += `<h4>اكتشاف الأنماط:</h4><ul>`;
                    
                    if (fullText.includes('رقم العامل')) {
                        html += `<li>✅ وجد "رقم العامل"</li>`;
                    }
                    if (fullText.includes('بيانات مفردات')) {
                        html += `<li>✅ وجد "بيانات مفردات"</li>`;
                    }
                    if (fullText.includes('كمبيوتر')) {
                        html += `<li>✅ وجد "كمبيوتر"</li>`;
                    }
                    
                    const numbers = fullText.match(/\d{4,}/g);
                    if (numbers) {
                        html += `<li>✅ أرقام محتملة: ${numbers.slice(0, 8).join(', ')}</li>`;
                    }
                    
                    // Arabic months
                    const arabicMonths = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
                    arabicMonths.forEach(month => {
                        if (fullText.includes(month)) {
                            html += `<li>✅ وجد الشهر: ${month}</li>`;
                        }
                    });
                    
                    html += `</ul>`;
                    
                    html += `</div>`;
                }

                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="analysis-result" style="border-left-color: #dc3545;">
                    <h3>خطأ</h3>
                    <p>${error.message}</p>
                </div>`;
                console.error('PDF Analysis Error:', error);
            }
        }
    </script>
</body>
</html>
